<h1 class="text-3xl">Listado de pokemons</h1>
<h2 class="text-xl">
    Pagina actual {{currentPage()}}
</h2>

<hr class="my-2">

@if (pokemons()) {
    <pokemon-list [pokemons]="pokemons()" />
} @else {
    <app-pokemon-list-skeleton></app-pokemon-list-skeleton>
}



<div class="flex justify-between">
    <button (click)="loadPokemons(-1)" class="mt-2">Anteriores</button>
    <button (click)="loadPokemons(+1)" class="mt-2">Siguientes</button>
    <!-- <button (click)="currentName.set('otro')" class="mt-2">{{currentName()}}</button> -->
</div>
